[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockmind-core"
version = "0.1.0"
description = "Independent planning, building, and validation runtime for autonomous Minecraft agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "BlockMind contributors"}]
dependencies = []

[project.scripts]
blockmind = "blockmind.cli:main"

[tool.setuptools]
package-dir = {"" = "ai-core/src"}

[tool.setuptools.packages.find]
where = ["ai-core/src"]
